<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#a47148" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Ring -->
  <circle cx="48" cy="64" r="28" stroke="url(#gold-grad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95" />
  
  <!-- Right Ring (Interlocking) -->
  <circle cx="72" cy="64" r="28" stroke="url(#gold-grad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95" />

  <!-- Overlap Arch for true 3D interlock -->
  <path d="M 48 36 A 28 28 0 0 1 76 64" stroke="url(#gold-grad)" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Solitaire Diamond on Top -->
  <g transform="translate(60, 24)">
    <!-- Sparkle rays -->
    <path d="M 0 -12 L 0 12 M -12 0 L 12 0" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <!-- Diamond Gem -->
    <polygon points="0,-9 9,0 0,9 -9,0" fill="url(#diamond-grad)" filter="url(#glow)" />
    <!-- Inner facet -->
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
